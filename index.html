*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 17px/1.45 Nunito,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px}

h1{font-size:30px}h2{font-size:22px}
.sub{color:var(--mut);margin:2px 0 12px}
.stats{display:flex;gap:10px;margin-bottom:16px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--sec);border-radius:9px;transition:width .3s}
small{color:var(--mut)}
.row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;border:2px solid var(--pri);background:var(--pri);color:var(--pt);font:700 17px Nunito,sans-serif;padding:12px;border-radius:12px;cursor:pointer;min-height:48px}
.btn.alt{background:transparent;color:var(--pri)}
.btn.big{width:100%;background:var(--sun);border-color:var(--sun);color:var(--on-accent);font-size:19px;margin-top:4px}
.btn.ok{background:var(--color-success-dark);border-color:var(--color-success-dark);color:#fff}
.btn.no{background:var(--color-error);border-color:var(--color-error);color:#fff}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{background:none;border:0;font-size:26px;color:var(--tx);cursor:pointer;min-width:44px;min-height:44px}
.top .bar{flex:1;margin:0}
.flash{background:var(--card);border:2px solid var(--pri);border-radius:22px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer}
.big-w{font-size:44px;font-weight:700;line-height:1.1}
.ex{color:var(--mut);margin-top:10px}

.hint{color:var(--mut);margin-top:14px;font-size:15px}

.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.msg{font-weight:700;margin:14px 0 4px;min-height:28px}
.q{text-align:center;margin:8px 0 6px}
.foot{text-align:center;color:var(--mut);font-size:14px}

:root[data-big] body{font-size:20px}

#app.pg-f{animation:pgf .26s ease-out}#app.pg-b{animation:pgb .26s ease-out}#app.pg-n{animation:pgn .18s ease-out}

@keyframes pgn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

#app.pg-f>*,#app.pg-b>*{animation:rise .32s ease-out both}#app>*:nth-child(2){animation-delay:0.04s}#app>*:nth-child(3){animation-delay:0.08s}#app>*:nth-child(4){animation-delay:0.12s}#app>*:nth-child(5){animation-delay:0.16s}#app>*:nth-child(6){animation-delay:0.20s}#app>*:nth-child(7){animation-delay:0.24s}#app>*:nth-child(8){animation-delay:0.28s}
.opt.good{animation:bump .35s ease-out}.opt.bad{animation:shake .35s}
.btn:active,.opt:active,.chip:active{transform:scale(.97)}
.chat{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;animation:rise .25s ease-out both}
.bub.bot{background:var(--card);border:1px solid var(--bd);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--pri);color:var(--pt);align-self:flex-end;border-bottom-right-radius:4px}
.bub.fb,.bub.gd,.bub.ht{align-self:stretch;max-width:100%;font-size:15px}
.bub.fb{background:color-mix(in srgb,var(--bad) 12%,var(--card));border:1px solid var(--bad)}
.bub.gd{background:color-mix(in srgb,var(--ok) 12%,var(--card));border:1px solid var(--ok)}
.bub.ht{background:var(--color-info-light);color:var(--color-info-dark)}
.micb{width:100%;padding:18px;border-radius:16px;border:0;background:var(--sun);color:var(--on-accent);font:700 19px Nunito,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;margin-top:12px}

.orow{display:flex;gap:8px;align-items:center}.orow .opt{flex:1}.orow .ic{width:40px;height:40px;font-size:18px;margin-top:8px}.opt.sel{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
#rpw{border-radius:16px}.fl-ok{animation:flok .9s}.fl-bad{animation:flbad .9s}
@keyframes flok{0%{background:color-mix(in srgb,var(--ok) 35%,transparent)}100%{background:transparent}}

function xy(f,t,v,d){const T=ac().currentTime+t;[[1,1,1],[3.9,.35,.4],[9.2,.1,.15]].forEach(([r,g,m])=>{const o=AC.createOscillator(),n=AC.createGain();o.type='sine';o.frequency.value=f*r;n.gain.setValueAtTime(.0001,T);n.gain.linearRampToValueAtTime(v*g,T+.005);n.gain.exponentialRampToValueAtTime(.0001,T+d*m);o.connect(n);n.connect(AC.destination);o.start(T);o.stop(T+d*m+.05)})}

{id:'be',name:'Verbo to be (ser/estar)',e:'🧩',t:`<p>En inglés siempre se dice el sujeto. <b>To be</b> significa <b>ser</b> o <b>estar</b> y cambia según quién habla:</p><ul><li><b>I am</b> = yo soy / estoy</li><li><b>You are</b> = tú eres / estás</li><li><b>He is</b> = él es / está</li><li><b>She is</b> = ella es / está</li><li><b>We are</b> = nosotros somos</li><li><b>They are</b> = ellos son</li></ul><p>Para negar, agrega <b>not</b>: I am <b>not</b> tired.</p>`,s:['I am a father.','She is my sister.','We are friends.'],x:[['I ___ Carlos.','am',['am','is','are']],['She ___ my mother.','is',['am','is','are']],['We ___ a family.','are',['am','is','are']],['He ___ my brother.','is',['is','are','am']],['They ___ my friends.','are',['is','am','are']]]},
{id:'art',name:'Artículos a / an',e:'🔤',t:`<p><b>A</b> y <b>an</b> significan "un / una". La regla depende del <b>sonido</b> de la palabra que sigue:</p><ul><li><b>a</b> antes de consonante: a brother, a sister</li><li><b>an</b> antes de vocal (a, e, i, o, u): an uncle, an apple</li></ul><p>Solo se usan con una cosa o persona, nunca en plural.</p>`,s:['I have a brother.','She is an aunt.','It is an apple.'],x:[['I have ___ brother.','a',['a','an']],['She is ___ aunt.','an',['a','an']],['He is ___ friend.','a',['a','an']],['It is ___ apple.','an',['a','an']],['This is ___ family.','a',['a','an']]]},
{id:'pos',name:'Mi, tu, su (my, your...)',e:'👪',t:`<p>Van <b>antes</b> del sustantivo y no cambian por género ni número:</p><ul><li><b>my</b> = mi · <b>your</b> = tu</li><li><b>his</b> = su (de él) · <b>her</b> = su (de ella)</li><li><b>our</b> = nuestro · <b>their</b> = su (de ellos)</li></ul><p>my mother, my brothers (siempre "my", aunque sea plural).</p>`,s:['This is my mother.','He loves his daughter.','We love our family.'],x:[['I love ___ family.','my',['my','your','their']],['Ana loves ___ son.','her',['his','her','my']],['Carlos loves ___ daughter.','his',['his','her','our']],['You love ___ mother.','your',['your','my','his']],['We love ___ house.','our',['our','their','my']]]},
{k:2,id:'ps',name:'Presente simple (eat / eats)',e:'🍽️',t:`<p>Para hábitos y cosas que haces siempre, usa el verbo tal cual con <b>I, you, we, they</b>:</p><ul><li>I <b>eat</b> rice. · They <b>drink</b> milk.</li></ul><p>Con <b>he, she, it</b> agrega <b>-s</b>:</p><ul><li>She <b>eats</b> rice. · He <b>drinks</b> coffee.</li></ul><p>Para negar usa <b>don't</b> (I, you, we, they) o <b>doesn't</b> (he, she, it): I <b>don't</b> like milk. She <b>doesn't</b> like milk. Con doesn't el verbo no lleva -s.</p>`,s:['I eat rice every day.','She drinks coffee.','They drink milk.'],x:[['I ___ rice every day.','eat',['eat','eats']],['She ___ coffee.','drinks',['drink','drinks']],['We ___ fruit.','eat',['eat','eats']],['He ___ chicken.','eats',['eat','eats']],['They ___ milk.','drink',['drink','drinks']]]},
{k:2,id:'pl',name:'Plurales (egg → eggs)',e:'🥚',t:`<p>Para hablar de más de uno, agrega <b>-s</b>: one egg → two egg<b>s</b>.</p><p>Si la palabra termina en <b>s, x, ch, sh</b>, agrega <b>-es</b>: one box → two box<b>es</b>.</p><p>Algunos son irregulares y hay que memorizarlos: child → <b>children</b>, man → <b>men</b>, woman → <b>women</b>.</p>`,s:['One egg, two eggs.','One box, two boxes.','One child, two children.'],x:[['One egg, two ___.','eggs',['eggs','egg']],['One bean, three ___.','beans',['beans','bean']],['One box, two ___.','boxes',['boxes','boxs']],['One child, two ___.','children',['childs','children']],['One bus, two ___.','buses',['buses','buss']]]},
{k:2,id:'adj',name:'Colores y adjetivos',e:'🖍️',t:`<p>En inglés el adjetivo va <b>antes</b> del sustantivo, al revés que en español: <b>a red car</b> (un carro rojo).</p><p>Además el adjetivo <b>nunca cambia</b>: red car, red cars.</p>`,s:['I have a red car.','She has a blue bag.','They eat green apples.'],x:[['I have a ___.','red car',['red car','car red']],['They eat ___.','green apples',['green apples','apples green']],['He has a ___.','blue bag',['blue bag','bag blue']],['We have two ___.','yellow bananas',['yellow bananas','yellow banana','bananas yellow']],['She has a ___.','white shirt',['white shirt','shirt white']]]},
{k:3,id:'th',name:'There is / There are (hay)',e:'🔎',t:`<p>Para decir que algo <b>existe o hay</b> en un lugar, usa <b>there is</b> (uno) y <b>there are</b> (varios):</p><ul><li>There <b>is</b> a bed in the bedroom. (Hay una cama)</li><li>There <b>are</b> two chairs. (Hay dos sillas)</li></ul><p>Negativo: there <b>isn't</b> / there <b>aren't</b>. Pregunta: <b>Is there</b> a bank here? · <b>Are there</b> two doors?</p>`,s:['There is a bed in the bedroom.','There are two chairs.','Is there a bank here?'],x:[['There ___ a table in the kitchen.','is',['is','are']],['There ___ two windows.','are',['is','are']],['There ___ a park near my house.','is',['is','are']],['There ___ three chairs.','are',['is','are']],['___ there a bank here?','Is',['Is','Are']]]},
{k:3,id:'pr',name:'Preposiciones: in, on, under',e:'📍',t:`<p>Las preposiciones dicen <b>dónde</b> está algo:</p><ul><li><b>in</b> = dentro de / en: in my bag</li><li><b>on</b> = encima de, sobre: on the table</li><li><b>under</b> = debajo de: under the bed</li><li><b>next to</b> = al lado de: next to the park</li></ul>`,s:['The book is on the table.','The shoes are under the bed.','The bank is next to the park.'],x:[['The book is ___ the table. (encima)','on',['on','in','under']],['The shoes are ___ the bed. (debajo)','under',['under','on','next to']],['My phone is ___ my bag. (dentro)','in',['in','on','under']],['The school is ___ the park. (al lado)','next to',['next to','under','in']],['The clock is ___ the wall.','on',['on','under','in']]]},
{k:3,id:'wh',name:'Where is / Where are (¿dónde?)',e:'❓',t:`<p>Para preguntar <b>dónde</b> está algo usa <b>Where is</b> (uno) o <b>Where are</b> (varios):</p><ul><li><b>Where is</b> the bathroom? — <b>It is</b> next to the kitchen.</li><li><b>Where are</b> my keys? — <b>They are</b> on the table.</li></ul><p>Responde con <b>It is</b> para una cosa y <b>They are</b> para varias.</p>`,s:['Where is the bathroom?','Where are my keys?','They are on the table.'],x:[['Where ___ the school?','is',['is','are']],['Where ___ my shoes?','are',['is','are']],['Where is the phone? ___ is on the bed.','It',['It','They']],['Where are the keys? ___ are in my bag.','They',['They','It']],['Where ___ the market?','is',['is','are']]]},
{k:4,id:'tm',name:'La hora: at, in, on',e:'🕐',t:`<p>Para preguntar la hora: <b>What time is it?</b></p><p>Responde con <b>It is</b> + la hora: It is <b>seven o'clock</b> (7:00) · It is <b>seven thirty</b> (7:30).</p><p>Para decir <b>a qué hora</b> haces algo usa <b>at</b>: I wake up <b>at</b> six. Con partes del día usa <b>in</b> (in the morning), pero con night usa <b>at</b> (at night).</p>`,s:['What time is it?','It is seven thirty.','I wake up at six.'],x:[['What ___ is it?','time',['time','hour','day']],['It ___ seven thirty.','is',['is','are']],['I wake up ___ six.','at',['at','in','on']],['I work ___ the morning.','in',['in','at','on']],['I sleep ___ night.','at',['at','in','on']]]},
{k:4,id:'fq',name:'Siempre, a veces, nunca',e:'🔁',t:`<p>Los adverbios de frecuencia dicen <b>cuántas veces</b> haces algo. Van <b>antes del verbo</b>:</p><ul><li><b>always</b> = siempre · <b>usually</b> = normalmente</li><li><b>sometimes</b> = a veces · <b>never</b> = nunca</li></ul><p>I <b>always</b> eat breakfast. · She <b>never</b> drinks coffee.</p>`,s:['I always eat breakfast.','She never drinks coffee.','We sometimes cook.'],x:[['I ___ eat breakfast. (todos los días)','always',['always','never','sometimes']],['She ___ drinks coffee. (nunca)','never',['never','always','usually']],['We ___ study on Sunday. (a veces)','sometimes',['sometimes','always','never']],['He ___ works at night. (normalmente)','usually',['usually','never','sometimes']],['They ___ sleep late. (nunca)','never',['never','always','sometimes']]]},
{k:4,id:'dd',name:'Preguntas con Do / Does',e:'🙋',t:`<p>Para preguntar sobre hábitos usa <b>Do</b> (I, you, we, they) o <b>Does</b> (he, she, it) al inicio. El verbo va sin -s:</p><ul><li><b>Do</b> you work here? — Yes, I <b>do</b>.</li><li><b>Does</b> she cook? — No, she <b>doesn't</b>.</li></ul>`,s:['Do you work here?','Does she cook?','Yes, I do.'],x:[['___ you work here?','Do',['Do','Does']],['___ she cook every day?','Does',['Does','Do']],['Do they study? Yes, they ___.','do',['do','does']],['___ your mother work?','Does',['Does','Do']],['___ we have class today?','Do',['Do','Does']]]},
{k:5,id:'hv',name:'Have / Has (tener)',e:'🤲',t:`<p><b>Have</b> significa <b>tener</b>. Con <b>I, you, we, they</b> usa <b>have</b>; con <b>he, she, it</b> usa <b>has</b>:</p><ul><li>I <b>have</b> a dog.</li><li>She <b>has</b> a cat.</li></ul>`,s:['I have a dog.','She has a cat.','We have two birds.'],x:[['I ___ a dog.','have',['have','has']],['She ___ a red hat.','has',['have','has']],['They ___ two cats.','have',['have','has']],['He ___ a blue jacket.','has',['have','has']],['We ___ a big family.','have',['have','has']]]},
{k:5,id:'ts',name:'This / That / These / Those',e:'👉',t:`<p>Sirven para <b>señalar</b>:</p><ul><li><b>this</b> = este/esta (uno, cerca)</li><li><b>that</b> = ese/aquel (uno, lejos)</li><li><b>these</b> = estos (varios, cerca)</li><li><b>those</b> = esos (varios, lejos)</li></ul><p>This is my hat. · Those are my shoes.</p>`,s:['This is my hat.','That is my house.','These are my shoes.'],x:[['___ is my dog. (uno, cerca)','This',['This','That','These']],['___ is my school. (uno, lejos)','That',['That','This','Those']],['___ are my socks. (varios, cerca)','These',['These','This','Those']],['___ are your shoes. (varios, lejos)','Those',['Those','These','That']],['___ is my mother. (a mi lado)','This',['This','These','That']]]},
{k:5,id:'lk',name:'Me gusta: like / love',e:'❤️',t:`<p><b>Like</b> = gustar y <b>love</b> = amar o encantar:</p><ul><li>I <b>like</b> dogs. (me gustan los perros)</li><li>She <b>likes</b> cats. (con he/she/it agrega -s)</li></ul><p>Pregunta: <b>Do you like</b> fish? — Yes, I do.</p>`,s:['I like dogs.','She likes cats.','Do you like fish?'],x:[['I ___ dogs.','like',['like','likes']],['She ___ cats.','likes',['like','likes']],['Do you ___ fish?','like',['like','likes']],['He ___ his blue hat.','likes',['like','likes']],['They ___ rabbits.','like',['like','likes']]]},
{k:6,id:'cn',name:'Can (poder)',e:'💪',t:`<p><b>Can</b> significa <b>poder</b> o <b>saber hacer</b>. Es igual para todos y el verbo siguiente va sin -s:</p><ul><li>I <b>can</b> drive. · She <b>can</b> cook.</li><li>No puedo: I <b>cannot</b> swim.</li><li>Pregunta: <b>Can</b> you help me?</li></ul>`,s:['I can drive a car.','She can cook.','Can you help me?'],x:[['I ___ drive a car.','can',['can','cans','am']],['She can ___ English.','speak',['speak','speaks','speaking']],['___ you cook?','Can',['Can','Do','Are']],['He can ___ a bike.','ride',['ride','rides','riding']],['I ___ swim. (no puedo)','cannot',['cannot','can','am not']]]},
{k:6,id:'wn',name:'Want y need',e:'🙏',t:`<p><b>Want</b> = querer y <b>need</b> = necesitar. Con he/she/it agregan -s:</p><ul><li>I <b>want</b> water. · She <b>wants</b> a taxi.</li><li>I <b>need</b> money. · He <b>needs</b> a doctor.</li></ul><p>Con otro verbo usa <b>to</b>: I want <b>to</b> eat.</p>`,s:['I want water.','She needs a doctor.','I want to eat.'],x:[['I ___ water.','want',['want','wants']],['She ___ a taxi.','wants',['want','wants']],['He ___ a doctor.','needs',['need','needs']],['I want ___ eat.','to',['to','the','a']],['They ___ money.','need',['need','needs']]]},
{k:6,id:'im',name:'Órdenes y por favor',e:'📢',t:`<p>Para dar una orden usa el verbo <b>sin sujeto</b>: <b>Open</b> the door. <b>Sit</b> down. Agrega <b>please</b> para ser amable.</p><p>Para prohibir usa <b>do not</b> (o <b>don't</b>): <b>Do not</b> run here.</p>`,s:['Open the door, please.','Sit down.','Do not run here.'],x:[['___ the door, please.','Open',['Open','Opens','Opening']],['Please ___ down.','sit',['sit','sits','sitting']],['Do not ___ here.','run',['run','runs','running']],['___ your hands.','Wash',['Wash','Washes','Washing']],['Do ___ eat here.','not',['not','no','never']]]}
];
const gcard=()=>`<section class="card"><h2>📖 Gramática</h2><small>Aprende las reglas paso a paso</small>`+G.filter(g=>(g.k||1)==CU).map(g=>`<button class="opt" onclick="gram('${g.id}')">${g.e} ${g.name}${S.g&&S.g[g.id]!=null?' · ✓ '+S.g[g.id]+'/5':''}</button>`).join('')+`</section>`;
function gram(id){const g=G.find(x=>x.id==id);stopSay();$('#app').innerHTML=tb(0)+`<h2>${g.e} ${g.name}</h2><div class="card lesson">${g.t}<p>Ejemplos (toca para escuchar):</p>${g.s.map(x=>`<button class="opt" onclick="say('${x}')">🔊 ${x}</button>`).join('')}</div><button class="btn big" onclick="gx('${id}')">Practicar ejercicios</button><button class="btn big" style="background:var(--pri);border-color:var(--pri);color:var(--pt)" onclick="gw('${id}')">✍️ Escribir la respuesta</button>`}
let R={};
function gx(id){NX={l:'✍️ Ahora escribe la respuesta',c:"gw('"+id+"')"};R={id,q:shuf(G.find(x=>x.id==id).x),i:0,ok:0};gq()}
function gq(){
 if(R.i>=R.q.length){S.g=S.g||{};S.g[R.id]=Math.max(S.g[R.id]||0,R.ok);return done('¡Lección terminada!',`Acertaste ${R.ok} de ${R.q.length}.`)}
 const [s,a,o]=R.q[R.i];R.a=false;
 stopSay();$('#app').innerHTML=tb(R.i/R.q.length*100)+`<p class="q">Completa la oración</p><div class="big-w" style="text-align:center;font-size:32px">${s}</div>`+shuf(o).map(x=>`<button class="opt" onclick="gp(this,'${x}')">${x}</button>`).join('')+`<div class="msg" id="m"></div><div id="nx"></div>`}
function gp(b,x){if(R.a)return;R.a=true;const [s,a]=R.q[R.i];
 document.querySelectorAll('.opt').forEach(e=>{if(e.textContent==a)e.classList.add('good')});
 if(x==a){S.pts+=10;R.ok++;snd(1);$('#m').textContent='¡Correcto! +10 ⭐';$('#m').style.color='var(--ok)'}else{b.classList.add('bad');snd(0);$('#m').textContent='La respuesta es: '+a;$('#m').style.color='var(--bad)'}
 save();say(s.replace('___',a),600);
 $('#nx').innerHTML='<button class="btn" onclick="R.i++;gq()">Siguiente</button>'}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition,NW=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const nm=s=>s.toLowerCase().replace(/\b(\d+)\b/g,(x,d)=>NW[+d]||x).replace(/[^a-z ]/g,'').trim();
function sim(a,b){const d=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return 1-d[a.length][b.length]/Math.max(a.length,b.length,1)}
let P={};
function pron(id){P={q:shuf(all.filter(w=>w.u==id)).slice(0,8),i:0,sum:0,n:0,got:{}};pw()}
function pw(){
 if(P.i>=P.q.length)return done('¡Pronunciación completada!',`Practicaste ${P.q.length} palabras${P.n?` · promedio ${Math.round(P.sum/P.n)}%`:''}.`);
 const w=P.q[P.i];BLOB=null;
 stopSay();$('#app').innerHTML=tb(P.i/P.q.length*100)+`<p class="q">Escucha, habla y compara</p><div class="flash" style="cursor:default;min-height:200px">${pb(w)}<div class="big-w">${w.en}</div><div class="ex">${w.es}</div><button class="spk" onclick="say('${w.en}')" aria-label="Escuchar">🔊</button></div><button class="btn big" id="mic" onclick="rec()">🎤 Toca y habla</button><div class="msg" id="m" style="text-align:center"></div><div id="nx"><button class="btn alt" onclick="P.i++;pw()">Saltar</button></div><p class="foot">Tu grabación se queda en tu teléfono.</p>`;
 say(w.en,300)}
let BLOB=null;
function selfOk(){const k=P.q[P.i].en;if(!P.got[k]){P.got[k]=1;S.pts+=5;save()}snd(1);P.i++;pw()}
function playMine(){try{stopSay();new Audio(URL.createObjectURL(BLOB)).play()}catch(e){}}
async function rec(){
 const m=$('#m'),b=$('#mic'),w=P.q[P.i];let stream,mr,sr=null,out=null,err='',dead=false,stopped=false,ch=[];
 stopSay();BLOB=null;m.textContent='';
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){m.style.color='var(--bad)';m.textContent='Aquí el micrófono está bloqueado ('+(e.name||'error')+'). Puedes practicar sin micrófono: escucha el modelo, repite en voz alta y toca el botón.';$('#nx').innerHTML='<div class="row"><button class="btn alt" onclick="say(\''+w.en+'\')">🔊 Modelo</button></div><div class="row"><button class="btn" onclick="selfOk()">Ya lo dije en voz alta · +5 ⭐</button></div>';return}
 b.disabled=true;b.textContent='🎙️ Habla ahora...';
 try{mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};mr.start()}catch(e){mr=null}
 if(SR){try{sr=new SR();sr.lang='en-US';sr.maxAlternatives=5;
  sr.onresult=e=>{const al=[...e.results[0]].map(a=>a.transcript),t=nm(w.en);let best=0,heard=al[0];al.forEach(a=>{const c=sim(nm(a),t);if(c>best){best=c;heard=a}});out={p:Math.round(best*100),heard}};
  sr.onerror=e=>{err=e.error;if(err!='no-speech'&&err!='aborted')dead=true};
  sr.onend=()=>{if(!dead)setTimeout(finish,250)};sr.start()}catch(e){sr=null}}
 setTimeout(finish,5500);
 function finish(){if(stopped)return;stopped=true;try{sr&&sr.stop()}catch(e){}
  const end=()=>{stream.getTracks().forEach(t=>t.stop());if(ch.length)BLOB=new Blob(ch,{type:mr.mimeType});after()};
  if(mr&&mr.state!='inactive'){mr.onstop=end;mr.stop()}else end()}
 function after(){
  b.disabled=false;b.textContent='🎤 Intentar otra vez';const k=w.en,first=!P.got[k];let pts=0;
  if(out&&out.p>=85){snd(1);pts=15;P.sum+=out.p;P.n++;S.pp=(S.pp||0)+1;m.style.color='var(--ok)';m.textContent=`¡Excelente! ${out.p}%`}
  else if(out&&out.p>=60){snd(1);pts=10;P.sum+=out.p;P.n++;m.style.color='var(--warn)';m.textContent=`Casi. Entendimos “${out.heard}” (${out.p}%)`}
  else if(out){snd(0);pts=5;m.style.color='var(--bad)';m.textContent=`Entendimos “${out.heard}” (${out.p}%). Compara tu voz con el modelo e inténtalo otra vez.`}
  else if(BLOB){snd(1);pts=5;m.style.color='var(--mut)';m.textContent='No pudimos calificarla automáticamente. Escucha tu voz y compárala con el modelo.'}
  else{snd(0);m.style.color='var(--bad)';m.textContent=/allowed/.test(err)?'El micrófono está bloqueado (error: '+err+'). Abre el enlace directo en Chrome.':'No te escuchamos. Acércate al micrófono e inténtalo otra vez.';return}
  if(first){P.got[k]=1;S.pts+=pts;m.textContent+=` · +${pts} ⭐`}
  save();
  $('#nx').innerHTML=`<div class="row">${BLOB?'<button class="btn alt" onclick="playMine()">▶ Mi voz</button>':''}<button class="btn alt" onclick="say('${k}')">🔊 Modelo</button></div><div class="row"><button class="btn" onclick="P.i++;pw()">Siguiente</button></div>`}
}

const PL=[['A1',6,'Principiante','Puedes saludar, presentarte y usar expresiones básicas para pedir cosas y hablar de ti y tu familia. Entiendes frases muy simples y pausadas.','My name is Carlos.'],['A2',8,'Básico','Puedes hablar de tu rutina, tu trabajo y tus compras, y mantener conversaciones cortas sobre temas conocidos. Entiendes mensajes y avisos sencillos.','I usually wake up at six.'],['B1',10,'Intermedio','Puedes desenvolverte de viaje, contar experiencias, dar tu opinión y explicar planes. Entiendes lo principal de una conversación normal.','I have been learning English for a year.'],['B2',10,'Intermedio alto','Puedes conversar con fluidez con hablantes nativos, entender textos complejos y defender tus ideas con argumentos claros.','Although it was expensive, it was worth it.'],['C1',8,'Avanzado','Te expresas con soltura y precisión, entiendes textos largos y exigentes, y usas el idioma para trabajar o estudiar sin dificultad.','Had I known, I would have acted differently.'],['C2',6,'Dominio','Dominas el idioma casi como un nativo: captas matices, humor e ideas complejas y hablas de cualquier tema con naturalidad.','It goes without saying that nuance matters.']],NU=Math.max(...U.map(u=>u.k||1));
function ub(k){const ws=all.filter(w=>w.k==k),gs=G.filter(g=>(g.k||1)==k),f=(a,b)=>b?a/b:1;return{w:f(ws.filter(w=>bx(w)>=2).length,ws.length),g:f(gs.reduce((a,g)=>a+Math.min(1,Math.max((S.g||{})[g.id]||0,(S.gw||{})[g.id]||0)/4),0),gs.length),e:Math.min(1,((S.wr||{})[k]||0)/6)}}
function up(k){if(!all.some(w=>w.k==k))return 0;const b=ub(k);return(b.w+b.g+b.e)/3}
function route(){let k=0;const tot=PL.reduce((a,l)=>a+l[1],0),lv=PL.map(l=>{const ks=[...Array(l[1])].map(()=>++k);return{n:l[0],t:l[2],d:l[3],x:l[4],c:l[1],ks,p:ks.reduce((a,x)=>a+(x<=NU?up(x):0),0)/l[1]}});return{lv,all:lv.reduce((a,l)=>a+l.p*l.c,0)/tot}}
function rcard(){const r=route(),c=r.lv.find(l=>l.p<.999)||r.lv[5];
 return `<div class="card" onclick="ruta()" role="button" tabindex="0"><b>🧭 Mi camino a C2</b><span style="float:right"><b>${Math.round(r.all*100)}%</b></span><div class="seg">${r.lv.map(l=>`<div style="flex:${l.c}"><i style="width:${l.p*100}%"></i></div>`).join('')}</div><div class="seg lab">${r.lv.map(l=>`<span style="flex:${l.c}">${l.n}</span>`).join('')}</div><small>Ahora estás en <b>${c.n}</b> · ${Math.round(c.p*100)}% de este nivel<br>${c.d}<br>Toca para ver toda la ruta</small></div>`}

let C={};
function ins(h){$('#ch').insertAdjacentHTML('beforeend',h);try{$('#cin').scrollIntoView({behavior:'smooth',block:'end'})}catch(e){}}
function cev(raw,t){const v=nz(raw),notes=[],o=t[4]||{};
 if(/(^|[^A-Za-z])i([^A-Za-z]|$)/.test(raw))notes.push('Recuerda: "I" (yo) siempre va con mayúscula.');
 (o.c||[]).forEach(w=>{if(new RegExp('(^|[^a-z])'+w.toLowerCase()+'($|[^a-z])').test(raw))notes.push('Se escribe con mayúscula: '+w+'.')});
 if(new RegExp(t[1]).test(v))return{ok:1,notes};
 for(const [p,m] of t[3])if(new RegExp(p).test(v))return{ok:0,msg:m,notes};
 if(sim(v,nz(t[2]))>=.8)return{ok:0,msg:'¡Casi! Revisa la ortografía, hay una letra distinta.',notes};
 if(v.split(' ').length<2)return{ok:0,msg:'Escribe una frase completa, no solo una palabra.',notes};
 return{ok:0,msg:'Esa respuesta no encaja con la pregunta. Lee la pregunta otra vez.',notes}}
function chat(k){const cv=CV.find(x=>x.k==k);C={cv,i:0,tr:0,ok:0,h:0};
 stopSay();$('#app').innerHTML=tb(0)+`<h2>${cv.e} ${cv.t}</h2><p class="sub">Responde en inglés con frases completas. Si te equivocas, te explico por qué.</p><div class="chat" id="ch"></div><div id="cin"></div>`;cbot()}
function cbot(){const t=C.cv.d[C.i],p=(t[4]||{}).p;C.tr=0;C.h=0;
 ins(`<div class="bub bot">${p?`<div style="font-size:40px">${p}</div>`:''}${t[0]} <button class="ic sm" onclick="say('${t[0]}')" aria-label="Escuchar">🔊</button></div>`);
 $('#cin').innerHTML=`<input id="ci" class="in" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Escribe tu respuesta en inglés..." onkeydown="if(event.key=='Enter')csend()"><div class="row"><button class="btn alt" onclick="chint()">💡 Pista</button><button class="btn" onclick="csend()">Enviar</button></div>`;
 say(t[0],300)}
function csend(){const inp=$('#ci');if(!inp)return;const raw=inp.value.trim();if(!raw)return;const t=C.cv.d[C.i],r=cev(raw,t);C.tr++;
 ins(`<div class="bub me">${raw.replace(/[<>&]/g,'')}</div>`);inp.value='';
 const nt=r.notes.map(n=>`<br>💡 ${n}`).join('');
 if(r.ok){snd(1);const p=C.tr==1?10:5;S.pts+=p;if(C.tr==1)C.ok++;ins(`<div class="bub gd">✅ ¡Muy bien! +${p} ⭐${nt}</div>`);cnext()}
 else if(C.tr>=2){snd(0);ins(`<div class="bub fb">❌ ${r.msg}<br>Respuesta de ejemplo: <b>${t[2]}</b> <button class="ic sm" onclick="say('${t[2]}')" aria-label="Escuchar">🔊</button>${nt}</div>`);cnext()}
 else{snd(0);ins(`<div class="bub fb">❌ ${r.msg}${nt}<br>Inténtalo otra vez. Puedes usar 💡 Pista.</div>`)}
 save()}
function chint(){const t=C.cv.d[C.i],ws=t[2].split(' ');C.h=Math.min(C.h+1,2);
 ins(`<div class="bub ht">💡 ${C.h==1?'Empieza así: <b>'+ws.slice(0,2).join(' ')+' ...</b>':'Forma de la respuesta: <b>'+ws.map((x,i)=>i<2?x:x.replace(/[A-Za-z]/g,'_')).join(' ')+'</b>'}</div>`)}
function cnext(){$('#cin').innerHTML='<button class="btn" onclick="cgo()">Continuar</button>';try{$('#cin').scrollIntoView({behavior:'smooth',block:'end'})}catch(e){}}
function cgo(){C.i++;if(C.i>=C.cv.d.length){S.cv=S.cv||{};S.cv[C.cv.k]=Math.max(S.cv[C.cv.k]||0,C.ok);save();return done('¡Conversación terminada!',`Respondiste bien ${C.ok} de ${C.cv.d.length} a la primera.`)}cbot()}

let RS={},HELD=false,SRO=null,MRO=null,MCB=null,MBLOB=null;
const rpi=()=>RS.items[RS.i];
function rpHub(){const M=[['rp','🎭','Roleplay'],['sh','🔁','Shadowing'],['bl','🧠','A ciegas']];
 stopSay();$('#app').innerHTML=tb(0)+`<h2>🎭 Roleplay</h2><p class="sub">Practica hablando. Mantén presionado el 🎤, lee tu respuesta en voz alta y la app comprueba lo que dijiste.</p>`+RP.map(r=>`<section class="card"><b>${r.e} Unidad ${r.k} · ${r.t}</b><br><small>${r.sc}</small><div class="steps">${M.map(m=>`<button class="chip${(S.rd||{})[r.k+m[0]]?' ok':''}" onclick="rpStart(${r.k},'${m[0]}')"><span>${(S.rd||{})[r.k+m[0]]?'✅':m[1]}</span><small>${m[2]}</small></button>`).join('')}</div></section>`).join('')+`<p class="foot"><b>Roleplay:</b> eliges y lees una respuesta guiada. <b>Shadowing:</b> repites una frase igual que el modelo. <b>A ciegas:</b> respondes sin guion y te autoevalúas.</p>`}
function rpStart(k,mode){const r=RP.find(x=>x.k==k);
 const items=mode=='sh'?shuf(all.filter(w=>w.k==k&&w.ex)).slice(0,6).map(w=>({s:w.ex})):r.d.map(t=>({b:t[0],o:t[1],kw:t[2],n:t[3]||2,ideal:t[1][0]||t[4]}));
 RS={mode,k,r,items,i:0,tr:0,ok:0,typed:false,sel:-1};rpShow()}
function rpShow(){
 if(RS.i>=RS.items.length){S.rd=S.rd||{};S.rd[RS.k+RS.mode]=1;save();return done('¡Práctica terminada!',`Aciertos a la primera: ${RS.ok} de ${RS.items.length}.`)}
 const it=rpi(),ttl={rp:'🎭 '+RS.r.t,sh:'🔁 Shadowing',bl:'🧠 A ciegas'}[RS.mode];let body='';RS.tr=0;RS.sel=-1;MBLOB=null;
 if(RS.mode=='sh')body=`<p class="q">Escucha y repite exactamente la frase</p><div class="card" style="text-align:center"><div class="big-w" style="font-size:26px">${it.s}</div><div class="row"><button class="btn alt" onclick="say('${it.s}')">🔊 Normal</button><button class="btn alt" onclick="say('${it.s}',80,.5)">🐢 Lento</button></div></div>`;
 else{body=(RS.mode=='rp'&&RS.i==0?`<p class="sub">${RS.r.sc}</p>`:'')+`<div class="chat"><div class="bub bot"><span style="font-size:28px">${RS.r.e}</span> ${it.b} <button class="ic sm" onclick="say('${it.b}')" aria-label="Escuchar">🔊</button></div></div>`;
  if(RS.mode=='rp')body+=it.kw?`<p class="q">Responde con tus palabras. Menciona al menos ${it.n} de: <b>${it.kw.join(', ')}</b></p>`:`<p class="q">Elige qué responder y léelo en voz alta:</p>`+it.o.map((o,j)=>`<div class="orow"><button class="opt" id="op${j}" onclick="rpSel(${j})">${o}</button><button class="ic" onclick="say('${o}')" aria-label="Escuchar">🔊</button></div>`).join('');
  else body+=`<p class="q">Responde con tus propias palabras, sin guion.</p>`}
 stopSay();$('#app').innerHTML=tb(RS.i/RS.items.length*100)+`<h2>${ttl}</h2><div id="rpw">${body}</div><div id="rpm"></div><div id="rpfb"></div><div id="rpnx"><button class="btn alt" style="width:100%;margin-top:10px" onclick="RS.i++;rpShow()">Saltar</button></div>`;
 rpMic();say(it.s||it.b,400)}
function rpSel(j){RS.sel=j;document.querySelectorAll('.orow .opt').forEach((b,i)=>b.classList.toggle('sel',i==j))}
function rpMic(){const bl=RS.mode=='bl';
 MCB={rec:bl,label:bl?'🎤 Mantén presionado y responde':'🎤 Mantén presionado y habla',fn:(o,e)=>bl?blDone(o,e):rpHeard(o,e)};
 $('#rpm').innerHTML=RS.typed&&!bl?`<input id="ti" class="in" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Escribe lo que dirías..." onkeydown="if(event.key=='Enter')rpTyped()"><button class="btn" style="width:100%" onclick="rpTyped()">Enviar</button>`:`<button id="mic" class="micb" onpointerdown="mic(1)" onpointerup="mic(0)" onpointerleave="mic(0)" onpointercancel="mic(0)" oncontextmenu="return false">${MCB.label}</button>`}
function mic(on){if(on){if(HELD||!MCB)return;HELD=true;stopSay();micStart()}else{if(!HELD)return;HELD=false;micStop()}}
function micStart(){const b=$('#mic');if(b){b.textContent='🎙️ Te escucho... suelta al terminar';b.classList.add('rec')}
 if(MCB.rec){navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{if(!HELD){st.getTracks().forEach(t=>t.stop());MCB.fn(null,'short');return}
   const ch=[];MRO=new MediaRecorder(st);MRO.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};MRO.onstop=()=>{st.getTracks().forEach(t=>t.stop());MCB.fn(ch.length?new Blob(ch,{type:MRO.mimeType}):null)};MRO.start()}).catch(e=>{HELD=false;MCB.fn(null,e.name)});return}
 if(!SR){HELD=false;MCB.fn(null,'nosr');return}
 let out=null,err='';SRO=new SR();SRO.lang='en-US';SRO.maxAlternatives=5;
 SRO.onresult=e=>{out=[...e.results[0]].map(a=>a.transcript)};SRO.onerror=e=>{err=e.error};
 SRO.onend=()=>{HELD=false;const b=$('#mic');if(b){b.textContent=MCB.label;b.classList.remove('rec')}MCB.fn(out,err)};
 try{SRO.start()}catch(e){HELD=false;MCB.fn(null,'start')}}
function micStop(){const b=$('#mic');if(b&&MCB.rec){b.textContent=MCB.label;b.classList.remove('rec')}try{if(MCB.rec){MRO&&MRO.state!='inactive'&&MRO.stop()}else SRO&&SRO.stop()}catch(e){}}
function rpHeard(o,e){const fb=$('#rpfb');
 if(o&&o.length)return rpEv(o);
 if(/allowed|nosr|start|capture/.test(e||'')){RS.typed=true;fb.innerHTML='<div class="bub ht">El micrófono no está disponible aquí. Escribe tu respuesta para seguir practicando.</div>';rpMic();return}
 fb.innerHTML='<div class="bub fb">No te escuchamos bien. Mantén presionado, habla cerca del micrófono y suelta al terminar.</div>'}
function rpTyped(){const v=($('#ti')||{}).value;if(v&&v.trim())rpEv([v.trim()])}
function rpEv(tx){const it=rpi();let ok=0,msg='',best=it.ideal||'';const hw=nz(tx[0]).split(' ');
 if(it.kw){const got=it.kw.filter(k=>hw.some(w=>w==k||w==k+'s'));ok=got.length>=it.n;msg=`Faltan palabras clave. Menciona al menos ${it.n}: ${it.kw.filter(k=>!got.includes(k)).slice(0,4).join(', ')}.`}
 else{let bs=0;const cs=RS.mode=='sh'?[it.s]:(RS.sel>=0?[it.o[RS.sel],...it.o]:it.o);
  tx.forEach(h=>cs.forEach(o=>{const c=sim(nz(h),nz(o));if(c>bs){bs=c;best=o}}));ok=bs>=.8;
  const ms=nz(best).split(' ').filter(w=>!hw.includes(w));
  msg=bs<.4?'No entendimos bien tu frase. Léela más despacio y con claridad.':`Parece que no pronunciaste bien: ${ms.slice(0,3).map(w=>'“'+w+'”').join(', ')||'alguna palabra'}. Escucha el modelo e inténtalo otra vez.`}
 RS.tr++;const heard=tx[0].replace(/[<>&]/g,''),w=$('#rpw');w.classList.remove('fl-ok','fl-bad');void w.offsetWidth;
 if(ok){snd(1);w.classList.add('fl-ok');const p=RS.mode=='sh'?10:RS.tr==1?15:8;S.pts+=p;if(RS.tr==1)RS.ok++;$('#rpfb').innerHTML=`<div class="bub gd">✅ ¡Correcto! Dijiste: “${heard}” · +${p} ⭐</div>`;rpNext()}
 else{snd(0);w.classList.add('fl-bad');const last=RS.tr>=2;$('#rpfb').innerHTML=`<div class="bub fb">❌ Escuchamos: “${heard}”<br>${msg}${last?`<br>Modelo: <b>${best}</b> <button class="ic sm" onclick="say(rpi().ideal||rpi().s||'')" aria-label="Escuchar">🔊</button>`:''}</div>`;if(last)rpNext()}
 save()}
